! ---------------------------------------------------------------------------
! Access-switch baseline. Brings a switch up secured first, reachable second.
! VLAN IDs and the trunk allow-list mirror the segmentation in docs/01 and 05.
! ---------------------------------------------------------------------------

hostname access-switch-01
!
no ip domain-lookup
ip domain-name lab.example
!
! --- Local admin + SSH only, no Telnet ---
username netadmin privilege 15 secret <secret>
enable secret <secret>
crypto key generate rsa modulus 2048
ip ssh version 2
!
line con 0
 login local
 exec-timeout 5 0
line vty 0 4
 login local
 transport input ssh
 exec-timeout 5 0
!
! --- VLANs this switch carries ---
vlan 10
 name Trusted
vlan 20
 name IoT
vlan 40
 name Personal-A
vlan 70
 name Lab-Mgmt
vlan 80
 name Lab-Servers
!
! --- Management SVI lives on the management VLAN only ---
interface Vlan1
 description management
 ip address 192.168.1.20 255.255.255.0
 no shutdown
ip default-gateway 192.168.1.1
!
! --- Access port: a trusted client device ---
interface GigabitEthernet0/2
 description trusted-client
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
!
! --- Access port: an isolated IoT device ---
interface GigabitEthernet0/3
 description iot-device
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
!
! --- Uplink trunk: carry only what the upstream needs ---
interface GigabitEthernet0/1
 description uplink-to-core
 switchport mode trunk
 switchport trunk allowed vlan 10,20,40,70,80
!
end
