# Management Access WireGuard server (see docs/04-remote-access.md).
# The point of this file is the routing, not the crypto:
# a connected client lands in 10.200.6.0/24 and is allowed, by gateway policy,
# to reach the Lab-Mgmt (192.168.70.0/24) and Lab-Servers (192.168.80.0/24) zones.

[Interface]
Address = 10.200.6.1/24
ListenPort = 51822
PrivateKey = <private-key>

# Admin client
[Peer]
PublicKey = <client-public-key>
AllowedIPs = 10.200.6.2/32
